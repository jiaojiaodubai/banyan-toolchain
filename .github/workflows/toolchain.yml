name: toolchain

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-artifacts re-derives toolchainRevision from the last
          # build-input commit, which is the parent of the manifest commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: actions/upload-artifact@v4
        with:
          name: banyan-toolchain
          path: |
            artifacts/
            toolchain.manifest.json
          if-no-files-found: error
